name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (editable + dev)
        run: pip install -e .[dev]

      - name: Fetch preset checkouts
        run: python scripts/fetch_targets.py

      - name: Pytest
        run: pytest -q

      - name: Offline replay (byte-identical reports)
        run: python scripts/check_replay.py --timeout 600
        env:
          MODEL_API_KEY: ""

      - name: UI install
        working-directory: ui
        run: npm ci

      - name: UI tests
        working-directory: ui
        run: npm test

      - name: UI dist freshness
        working-directory: ui
        run: npm run check-dist

      - name: Leak scan over committed presets
        run: >-
          python -c "import sys; sys.path.insert(0, 'src');
          from pathlib import Path;
          from chainreaction.runs.store import scan_for_leaks;
          issues = scan_for_leaks(Path('runs/presets'));
          print('\n'.join(issues) if issues else 'no leaks');
          raise SystemExit(1 if issues else 0)"
