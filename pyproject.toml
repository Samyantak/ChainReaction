[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chainreaction"
version = "0.1.0"
description = "ChainReaction: verifiable upgrade-impact investigator (hackathon build)"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "openai",
    "fastapi",
    "uvicorn",
    "coverage>=7",  # imported at top level by chainreaction.testmap
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
